name: 领取作业仓库
description: 选择课程，系统用你的 GitHub 账号自动创建作业仓库并发送邀请。
title: "领取作业仓库"
body:
  - type: markdown
    attributes:
      value: |
        提交后等待机器人回复，打开回复中的仓库邀请链接并接受邀请，即可开始实验。
        请先加入 [OpenCamp 秋冬季训练营](https://opencamp.cn/os2edu/camp/2026fall)，并绑定当前 GitHub 账号。
  - type: dropdown
    id: course
    attributes:
      label: 课程
      options:
        - "导学阶段-Rust 语言基础"
        - "基础阶段 - Rust 进阶 & OS 入门"
        - "专业阶段 - rCore-Tutorial"
        - "项目先导阶段 - 组件化操作系统"
    validations:
      required: true
